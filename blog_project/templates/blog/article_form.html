{% extends 'blog/base.html' %}

{% block title %}{% if form.instance.pk %}Edit Article{% else %}New Article{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{% if form.instance.pk %}Edit Article{% else %}New Article{% endif %}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% if form.instance.pk %}{% url 'article_detail' form.instance.pk %}{% else %}{% url 'home' %}{% endif %}" 
               class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
